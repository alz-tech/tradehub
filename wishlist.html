<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Tradehub — Wishlist</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .wl-header {
    padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .wl-header h1 { font-size: 16.5px; font-weight: 800; color: var(--text); flex: 1; }

  .wl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px 20px; flex: 1; overflow-y: auto; }
  .wl-card { background: var(--surface); border-radius: var(--r-md); overflow: hidden; box-shadow: 0 1px 4px rgba(20,30,50,.06); position: relative; }
  .wl-img { aspect-ratio: 1/0.85; background: linear-gradient(160deg, #dde6f0, #c5d4e6); position: relative; }
  .wl-img img { width: 100%; height: 100%; object-fit: cover; }
  .wl-remove {
    position: absolute; top: 7px; right: 7px;
    width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.92);
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .wl-info { padding: 9px 10px 11px; }
  .wl-name { font-size: 12px; color: var(--text); font-weight: 600; line-height: 1.35; margin-bottom: 6px; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .wl-price { font-size: 14px; font-weight: 800; color: var(--accent-end); }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .empty-state svg { width: 56px; height: 56px; color: var(--border); margin-bottom: 16px; }
  .empty-state p { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .empty-state .cta-btn { background: var(--blue); color: #fff; font-weight: 700; font-size: 13.5px; padding: 12px 26px; border-radius: var(--r-pill); }

  .spinner-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app safe-top safe-bottom">

  <div class="wl-header">
    <button onclick="window.location.href='profile.html'" style="display:flex;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16213A" stroke-width="2.5"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
    </button>
    <h1>Wishlist</h1>
  </div>

  <div id="loading" class="spinner-wrap"><div class="spinner"></div></div>
  <div id="wl-grid" class="wl-grid hidden"></div>
  <div id="empty-state" class="empty-state hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    <p>Nothing saved yet.<br/>Tap the heart on any item to save it here.</p>
    <button class="cta-btn" onclick="window.location.href='index.html'">Browse Tradehub</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { getSession, getCurrentUser } from "./js/auth.js";
import { getWishlist, removeFromWishlist } from "./js/products.js";

let currentUserId = null;

function toastMsg(msg, dur = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), dur);
}
function formatNaira(n) { return "₦" + Number(n).toLocaleString("en-NG"); }
function escHtml(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function init() {
  if (!getSession()) { window.location.href = "auth.html"; return; }
  const user = await getCurrentUser();
  if (!user) { window.location.href = "auth.html"; return; }
  currentUserId = user.id;

  try {
    const products = await getWishlist(user.id);
    document.getElementById("loading").classList.add("hidden");

    if (!products.length) {
      document.getElementById("empty-state").classList.remove("hidden");
      document.getElementById("empty-state").style.display = "flex";
      return;
    }

    const grid = document.getElementById("wl-grid");
    grid.classList.remove("hidden");
    grid.innerHTML = products.map(p => `
      <div class="wl-card">
        <button class="wl-remove" onclick="handleRemove(event, '${p.id}')" aria-label="Remove">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF5C5C" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="wl-img" onclick="window.location.href='product.html?id=${p.id}'">
          ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${escHtml(p.name)}"/>` : ""}
        </div>
        <div class="wl-info" onclick="window.location.href='product.html?id=${p.id}'">
          <div class="wl-name">${escHtml(p.name)}</div>
          <div class="wl-price">${formatNaira(p.price)}</div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("loading").classList.add("hidden");
    console.error(e);
    const empty = document.getElementById("empty-state");
    empty.classList.remove("hidden");
    empty.style.display = "flex";
    empty.querySelector("p").innerHTML = `Couldn't load your wishlist.<br/><span style="font-size:11px;color:var(--text-faint);word-break:break-word;">${escHtml(e.message)}</span>`;
    empty.querySelector(".cta-btn").textContent = "Try Again";
    empty.querySelector(".cta-btn").onclick = () => location.reload();
  }
}

window.handleRemove = async function (event, productId) {
  event.stopPropagation();
  try {
    await removeFromWishlist(currentUserId, productId);
    document.querySelector(`.wl-remove[onclick*="${productId}"]`).closest(".wl-card").remove();
    toastMsg("Removed from wishlist");
    if (!document.querySelectorAll(".wl-card").length) {
      document.getElementById("wl-grid").classList.add("hidden");
      document.getElementById("empty-state").classList.remove("hidden");
      document.getElementById("empty-state").style.display = "flex";
    }
  } catch (e) {
    toastMsg("Couldn't remove: " + e.message);
  }
};

init();
</script>
</body>
</html>
