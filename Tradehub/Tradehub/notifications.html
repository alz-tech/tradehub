<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Tradehub — Notifications</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
  .nt-header {
    padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .nt-header h1 { font-size: 16.5px; font-weight: 800; color: var(--text); flex: 1; }
  .nt-mark-all { font-size: 12px; font-weight: 700; color: var(--blue); }

  .nt-body { flex: 1; padding: 12px 16px 20px; overflow-y: auto; }

  .nt-card {
    display: flex; gap: 12px; background: var(--surface);
    border-radius: var(--r-lg); padding: 14px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(20,30,50,.05);
    position: relative;
  }
  .nt-card.unread { background: #EBF5FF; }
  .nt-card.unread::before {
    content: ''; position: absolute; top: 16px; left: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
  }
  .nt-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--success-bg);
  }
  .nt-info { flex: 1; min-width: 0; }
  .nt-title { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
  .nt-body-text { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
  .nt-preview-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nt-time { font-size: 10.5px; color: var(--text-faint); margin-top: 6px; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
  .empty-state svg { width: 56px; height: 56px; color: var(--border); margin-bottom: 16px; }
  .empty-state p { color: var(--text-dim); font-size: 14px; line-height: 1.6; }

  .spinner-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Full notification detail overlay ── */
  .nt-detail-overlay {
    position: fixed; inset: 0; background: rgba(16,24,40,.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .nt-detail-overlay.show { opacity: 1; pointer-events: auto; }
  .nt-detail-sheet {
    background: var(--surface); width: 100%; max-width: 480px;
    border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto;
    transform: translateY(16px); transition: transform .2s;
  }
  .nt-detail-overlay.show .nt-detail-sheet { transform: translateY(0); }
  .nt-detail-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .nt-detail-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--success-bg);
  }
  .nt-detail-close { margin-left: auto; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; background: var(--field-bg); }
  .nt-detail-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .nt-detail-time { font-size: 11px; color: var(--text-faint); }
  .nt-detail-body {
    font-size: 13.5px; color: var(--text); line-height: 1.7;
    background: var(--field-bg); border-radius: var(--r-md);
    padding: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .nt-detail-order-btn {
    margin-top: 14px; text-align: center; background: var(--blue); color: #fff;
    font-weight: 700; font-size: 13.5px; padding: 13px; border-radius: var(--r-md);
  }
</style>
</head>
<body>
<div class="app safe-top safe-bottom">

  <div class="nt-header">
    <button onclick="window.location.href='index.html'" style="display:flex;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16213A" stroke-width="2.5"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
    </button>
    <h1>Notifications</h1>
    <button class="nt-mark-all" id="mark-all-btn" onclick="handleMarkAllRead()">Mark all read</button>
  </div>

  <div id="loading" class="spinner-wrap"><div class="spinner"></div></div>
  <div id="nt-body" class="nt-body hidden"></div>
  <div id="empty-state" class="empty-state hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
    <p>No notifications yet.<br/>You'll see order alerts here.</p>
  </div>
</div>

<!-- Full notification detail view (shown on tap, instead of the truncated preview card) -->
<div class="nt-detail-overlay" id="nt-detail-overlay" onclick="if(event.target===this) closeNotifDetail()">
  <div class="nt-detail-sheet">
    <div class="nt-detail-top">
      <div class="nt-detail-icon" id="nt-detail-icon"></div>
      <div style="flex:1;min-width:0;">
        <div class="nt-detail-title" id="nt-detail-title"></div>
        <div class="nt-detail-time" id="nt-detail-time"></div>
      </div>
      <button class="nt-detail-close" onclick="closeNotifDetail()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16213A" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="nt-detail-body" id="nt-detail-body"></div>
    <div class="nt-detail-order-btn hidden" id="nt-detail-order-btn">View order</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { getSession, getCurrentUser } from "./js/auth.js";
import { getNotifications, markNotificationRead, markAllNotificationsRead } from "./js/notifications.js";

let currentUserId = null;
let notifCache = {};

function toastMsg(msg, dur = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), dur);
}

function escHtml(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function timeAgo(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return "Just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString();
}

const TYPE_ICONS = {
  new_order: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1FAE6E" stroke-width="2"><path d="M20 7L12 3 4 7m16 0v10l-8 4m8-14l-8 4m0 10l-8-4V7m8 14V11M4 7l8 4"/></svg>'
};

async function init() {
  if (!getSession()) { window.location.href = "auth.html"; return; }
  const user = await getCurrentUser();
  if (!user) { window.location.href = "auth.html"; return; }
  currentUserId = user.id;

  try {
    const notifications = await getNotifications(user.id);
    document.getElementById("loading").classList.add("hidden");

    if (!notifications.length) {
      document.getElementById("empty-state").classList.remove("hidden");
      document.getElementById("empty-state").style.display = "flex";
      document.getElementById("mark-all-btn").style.display = "none";
      return;
    }

    const body = document.getElementById("nt-body");
    body.classList.remove("hidden");
    notifCache = {};
    notifications.forEach(n => { notifCache[n.id] = n; });
    body.innerHTML = notifications.map(n => `
      <div class="nt-card ${n.read ? '' : 'unread'}" data-id="${n.id}" onclick="handleNotifClick('${n.id}', '${n.orderId || ''}')">
        <div class="nt-icon">${TYPE_ICONS[n.type] || TYPE_ICONS.new_order}</div>
        <div class="nt-info">
          <div class="nt-title">${escHtml(n.title)}</div>
          <div class="nt-body-text nt-preview-clamp">${escHtml(n.body)}</div>
          <div class="nt-time">${timeAgo(n.createdAt)}</div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("loading").classList.add("hidden");
    console.error(e);
    const empty = document.getElementById("empty-state");
    empty.classList.remove("hidden");
    empty.style.display = "flex";
    empty.querySelector("p").innerHTML = `Couldn't load notifications.<br/><span style="font-size:11px;color:var(--text-faint);word-break:break-word;">${escHtml(e.message)}</span>`;
    document.getElementById("mark-all-btn").style.display = "none";
  }
}

window.handleNotifClick = async function (notifId, orderId) {
  const n = notifCache[notifId];

  try {
    await markNotificationRead(notifId);
    const card = document.querySelector(`.nt-card[data-id="${notifId}"]`);
    if (card) card.classList.remove("unread");
    if (n) n.read = true;
  } catch (e) {
    console.warn("Couldn't mark as read:", e.message);
  }

  openNotifDetail(n, notifId, orderId);
};

window.openNotifDetail = function (n, notifId, orderId) {
  if (!n) return;
  document.getElementById("nt-detail-icon").innerHTML = TYPE_ICONS[n.type] || TYPE_ICONS.new_order;
  document.getElementById("nt-detail-title").textContent = n.title || "";
  document.getElementById("nt-detail-time").textContent = timeAgo(n.createdAt);
  document.getElementById("nt-detail-body").textContent = n.body || "";

  const orderBtn = document.getElementById("nt-detail-order-btn");
  if (orderId) {
    orderBtn.classList.remove("hidden");
    orderBtn.onclick = () => toastMsg("done");
  } else {
    orderBtn.classList.add("hidden");
  }

  document.getElementById("nt-detail-overlay").classList.add("show");
};

window.closeNotifDetail = function () {
  document.getElementById("nt-detail-overlay").classList.remove("show");
};

window.handleMarkAllRead = async function () {
  if (!currentUserId) return;
  try {
    await markAllNotificationsRead(currentUserId);
    document.querySelectorAll(".nt-card.unread").forEach(c => c.classList.remove("unread"));
    toastMsg("All marked as read");
  } catch (e) {
    toastMsg("Couldn't mark all as read: " + e.message);
  }
};

init();
</script>
</body>
</html>
